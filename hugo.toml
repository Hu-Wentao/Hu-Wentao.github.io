baseURL = 'https://wyattcoder.top/'
defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = false
title = '低熵工程'
theme = 'PaperMod'

[taxonomies]
    category = 'categories'
    tag = 'tags'
    artifact = 'artifacts'

[languages]
    [languages.zh]
        label = '中文'
        locale = 'zh-CN'
        weight = 1
    [languages.en]
        label = 'English'
        locale = 'en-US'
        title = 'Low-Entropy Engineering'
        weight = 2
        [languages.en.params]
            contentLanguage = 'en'
            languageName = 'English'
            [languages.en.params.label]
                text = "Low-Entropy Engineering · Wyatt's Artifacts"
        [[languages.en.menus.main]]
            identifier = 'posts'
            name = 'Posts'
            url = '/en/posts/'
            weight = 10
        [[languages.en.menus.main]]
            identifier = 'tags'
            name = 'Tags'
            url = '/en/tags/'
            weight = 20

[markup.goldmark.extensions.passthrough]
    enable = true

[markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)']]

[params]
    defaultTheme = "auto"
    showReadingTime = true
    displayFullContent = false
    ShowPostNavLinks = true
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true
    ShowToc = true
    languageName = "Chinese"
    contentLanguage = "zh"
    [params.label]
        text = "低熵工程 · Wyatt’s Artifacts"
    [[params.author]]
        name = "Hu Wentao"
        email = "hu.wentao@outlook.com"

[menu]
    [[menu.main]]
        identifier = "posts"
        name = "文章"
        url = "/posts"
        weight = 10
    [[menu.main]]
        identifier = "artifacts"
        name = "制品"
        url = "/artifacts"
        weight = 15
    [[menu.main]]
        identifier = "tags"
        name = "标签"
        url = "/tags"
        weight = 20
    [[menu.main]]
        identifier = "projects"
        name = "项目"
        url = "/projects"
        weight = 25
    [[menu.main]]
        identifier = "archives"
        name = "归档"
        url = "/archives"
        weight = 30
